<div class="field">
  <label>{{ label }}</label>
  <input
    type="text"
    [placeholder]="placeholder"
    [formControl]="doctorSearch"
    autocomplete="off"
  />

  @if (selectedDoctorInvalid) {
    <div class="err">{{ invalidMessage }}</div>
  }

  @if (doctorResults.length) {
    <ul class="autocomplete">
      @for (m of doctorResults; track m.id) {
        <li (click)="selectDoctor.emit(m)">
          <div class="line1">
            <strong>{{ optionTitle(m) }}</strong>
          </div>
          <div class="line2">
            <small>{{ optionSubtitle(m) }}</small>
          </div>
        </li>
      }
    </ul>
  }
</div>
